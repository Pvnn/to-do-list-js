<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do List</title>
  <link rel="stylesheet" href="STYLES/to-do-list-2.css">
</head>

<body>
  <h2>To-do List</h2>
  <div class="todo-input-grid">
    <input type="text" placeholder="Todo name" class="js-name-input name-input" onkeydown="handleKeydown(event);">
    <input type="date" class="js-due-date-input due-date-input">
    <button class="add-button js-add-button">Add</button>
  </div>
  <div class="js-todo-list todo-list"></div>
</body>

<script src="SCRIPTS/to-do-list-2.js"></script>

</html>
